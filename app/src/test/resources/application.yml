spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 25
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

wallet:
  demo-data:
    enabled: false
  withdrawal:
    scheduler:
      enabled: false

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'
